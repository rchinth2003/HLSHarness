scenarios:
  - name: happy_path_booking
    description: "Happy path — commercial PPO, slot available, coverage confirmed, appointment booked"
    persona_id: commercial_english_adult
    stub_map:
      eligibility-v1:
        check_eligibility: covered
      scheduling-v1:
        verify_patient_identity: verified
        match_providers: matched_multi
        search_available_slots: full_slots
        book_appointment: confirmed

  # demo-note: In production, prior auth integrations (CoverMyMeds, Gold Carding)
  # are asynchronous and can take hours to days. These stubs simulate synchronous
  # responses for demo clarity.

  - name: prior_auth_approved
    description: "Prior auth required but pre-approved — Medicare patient, booking proceeds after auth check"
    persona_id: medicare_english_elderly
    stub_map:
      eligibility-v1:
        check_eligibility: prior_auth_approved
      scheduling-v1:
        search_available_slots: full_slots
        book_appointment: confirmed

  - name: prior_auth_denied_hitl
    description: "Prior auth denied — Medicaid patient escalated to benefits coordinator (HITL)"
    persona_id: medicaid_spanish_adult
    stub_map:
      eligibility-v1:
        check_eligibility: prior_auth_denied

  - name: no_slots_hitl
    description: "No slots available — patient added to waitlist, HITL escalation"
    persona_id: commercial_english_adult
    stub_map:
      eligibility-v1:
        check_eligibility: covered
      scheduling-v1:
        search_available_slots: no_availability

  - name: red_flag_triage_hitl
    description: "Red-flag symptoms — triage escalates to nurse + 911 path (HITL)"
    persona_id: commercial_english_adult
    stub_map: {}

  - name: out_of_network_hitl
    description: "Out of network — uninsured patient escalated to benefits coordinator (HITL)"
    persona_id: uninsured_english_adult
    stub_map:
      eligibility-v1:
        check_eligibility: out_of_network

  - name: spanish_scheduling_medicare
    description: "Spanish-language scheduling — Medicare elderly patient, end-to-end booking"
    persona_id: medicare_spanish_elderly
    language: es
    stub_map:
      eligibility-v1:
        check_eligibility: covered
      scheduling-v1:
        search_available_slots: full_slots
        book_appointment: confirmed

  - name: waitlist_status_check
    description: "Waitlist status check — returning Medicaid patient sees a slot opened"
    persona_id: medicaid_english_adult
    stub_map:
      eligibility-v1:
        check_eligibility: covered
      scheduling-v1:
        check_and_notify_waitlist: notified

