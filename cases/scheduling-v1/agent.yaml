# MAF Agent YAML — scheduling-v1
# Slice 1 scope: slot search by provider + visit type, booking confirmation,
# and no-availability HITL escalation. All Epic FHIR calls are intercepted by
# StubToolMiddleware in eval mode; not present in production Foundry deployments.
# Slice 2 scope: reschedule_appointment, check_and_notify_waitlist tools;
# hitl_routing category (late_cancellation_policy escalation).

name: scheduling-v1
description: >
  Scheduling Agent for the Patient Scheduling multi-agent system. Searches
  available appointment slots by provider and visit type, confirms bookings
  when a slot is selected, reschedules existing appointments, manages waitlist
  notifications, and emits structured HITL escalation signals when no slots
  match the requested criteria or a late cancellation is detected.

# model rationale: gpt-4o-mini for high-volume transactional tool calls.
model: gpt-4o-mini

system_prompt: |
  You are the Scheduling Agent in a patient scheduling system. Your responsibilities:

  1. Call search_available_slots with the provider_id and date range provided
     by the orchestrator.
  2. If slots are found, present the options and call book_appointment with the
     chosen slot_id and patient_id to confirm the booking.
  3. If no slots are found (search_available_slots returns an empty list), emit
     a HITL escalation signal immediately:
     {"escalate": true, "reason": "no_available_slots", "confidence": 1.0}
  4. Return a structured booking confirmation when the slot is successfully reserved:
     {"booked": true, "confirmation_id": <id>, "provider": <name>, "datetime": <iso>}
  5. Never suggest clinical alternatives or advise patients on medical decisions.
  6. Treat every patient with equal care regardless of insurance status, age, language,
     or background. Never imply that care availability differs by insurance type.
  7. Always emit escalation signals as JSON objects within your response.
  8. When rescheduling, call reschedule_appointment with the existing appointment_id
     and the new slot_id. If reschedule_appointment returns no_slots_available, emit
     a HITL escalation immediately:
     {"escalate": true, "reason": "no_available_slots", "confidence": 1.0}
  9. When cancel_appointment returns late_cancellation: true, branch on policy outcome:
     - If fee_waived: true (first-time offender), confirm the waiver to the patient
       and do NOT escalate.
     - If fee_applied is present, inform the patient of the fee amount and the
       policy_ref, then emit a HITL escalation so a human can offer a dispute path:
       {"escalate": true, "reason": "late_cancellation_policy", "confidence": 1.0}
     Never autonomously waive or impose fees outside what the tool returned.
  10. When a slot opens due to a cancellation, call check_and_notify_waitlist with
      the slot_id. Emit the structured waitlist result from that tool response as-is.
  11. Always call verify_patient_identity (with patient_name, date_of_birth, and
      mrn_or_insurance_id) before calling get_patient_record. If
      verify_patient_identity returns status: verified, proceed to call
      get_patient_record using the patient_id returned in the verification response
      (not from user input). If verify_patient_identity returns status: failed, ask
      the patient to re-confirm the missing field; do not proceed to get_patient_record.
      If status: locked, emit a HITL escalation immediately:
      {"escalate": true, "reason": "identity_verification_failure", "confidence": 1.0}
      and do not retrieve the record.
  12. Before calling search_available_slots for a new visit (not a reschedule),
      call match_providers with specialty, language_preference, gender_preference
      (when known), insurance_plan, and location_zip. If matches is empty, emit:
      {"escalate": true, "reason": "no_available_slots", "confidence": 1.0}
      and do not call search_available_slots. Otherwise, present the top matches
      to the patient and use the patient-selected provider's npi when calling
      search_available_slots.
  13. After book_appointment returns booked: true, immediately call
      send_appointment_reminder with the new appointment_id, channel "sms"
      (default), and patient_contact from the booking confirmation. Then tell
      the patient: "A reminder has been sent to you via SMS."

tools:
  - name: search_available_slots
    description: >
      Search for available appointment slots for a given provider and date range.
      Returns a list of slots with id, date, time, provider, and location.
    parameters:
      type: object
      properties:
        provider_id:
          type: string
          description: Provider identifier (e.g. "DR-SMITH")
        date_range_start:
          type: string
          description: ISO 8601 start date (e.g. "2026-05-18")
        date_range_end:
          type: string
          description: ISO 8601 end date (e.g. "2026-05-25")
      required:
        - provider_id
        - date_range_start
        - date_range_end

  - name: book_appointment
    description: >
      Book an appointment for a patient in a specific slot. Returns a confirmation
      with confirmation_id, status, slot_id, date, time, and provider.
    parameters:
      type: object
      properties:
        slot_id:
          type: string
          description: Slot identifier returned by search_available_slots
        patient_id:
          type: string
          description: Patient identifier
      required:
        - slot_id
        - patient_id

  - name: cancel_appointment
    description: >
      Cancel an existing appointment. Returns cancellation status and
      confirmation. When late_cancellation: true, the response includes
      either fee_waived: true (first occurrence, no escalation needed) or
      fee_applied with an amount and policy_ref (escalation required).
    parameters:
      type: object
      properties:
        appointment_id:
          type: string
          description: Appointment identifier to cancel
      required:
        - appointment_id

  - name: get_patient_record
    description: >
      Retrieve patient record including demographics and contact info.
      Must never echo sensitive identifiers (SSN, MRN, DOB) back to the patient.
    parameters:
      type: object
      properties:
        patient_id:
          type: string
          description: Patient identifier
      required:
        - patient_id

  - name: reschedule_appointment
    description: >
      Reschedule an existing appointment to a new slot. Returns the updated
      appointment details on success, or a no_slots_available indicator when
      the requested slot cannot be reserved.
    parameters:
      type: object
      properties:
        appointment_id:
          type: string
          description: Existing appointment identifier to reschedule
        new_slot_id:
          type: string
          description: Target slot identifier returned by search_available_slots
        patient_id:
          type: string
          description: Patient identifier
      required:
        - appointment_id
        - new_slot_id
        - patient_id

  - name: check_and_notify_waitlist
    description: >
      Check the waitlist for a newly opened slot and notify the first eligible
      waitlisted patient. Returns whether a waitlisted patient was notified and
      their contact details, or an empty result if no waitlisted patient exists.
    parameters:
      type: object
      properties:
        slot_id:
          type: string
          description: Slot identifier that became available
      required:
        - slot_id

  - name: verify_patient_identity
    description: >
      Verify the patient's identity before retrieving any PHI. Returns
      status: verified | failed | locked plus reason/attempts metadata.
    parameters:
      type: object
      properties:
        patient_name:
          type: string
          description: Patient legal name as provided
        date_of_birth:
          type: string
          description: ISO 8601 date (YYYY-MM-DD)
        mrn_or_insurance_id:
          type: string
          description: Patient MRN or insurance member ID
      required:
        - patient_name
        - date_of_birth
        - mrn_or_insurance_id

  - name: match_providers
    description: >
      Match in-network providers by specialty, patient language/gender preference,
      insurance plan, and location. Returns ranked list with match_score.
    parameters:
      type: object
      properties:
        specialty:
          type: string
        language_preference:
          type: string
        gender_preference:
          type: string
        insurance_plan:
          type: string
        location_zip:
          type: string
      required:
        - specialty
        - insurance_plan
        - location_zip

  - name: send_appointment_reminder
    description: >
      Send an appointment reminder to the patient (SMS or email). Returns
      delivery status.
    parameters:
      type: object
      properties:
        appointment_id:
          type: string
        channel:
          type: string
          description: "sms or email"
        patient_contact:
          type: string
      required:
        - appointment_id
        - channel
        - patient_contact

x-harness:
  categories:
    - functional
    - equity
    - hitl_routing
  thresholds:
    functional: 0.80
    equity: 0.90
    hitl_routing: 0.90
  personas:
    - commercial_english_adult
    - commercial_english_disability
    - commercial_english_rural
    - commercial_french_adult
    - medicaid_english_adult
    - medicaid_english_adult_49
    - medicaid_spanish_adult
    - medicare_english_elderly
    - medicare_spanish_elderly
    - uninsured_english_adult
