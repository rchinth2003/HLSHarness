[project]
name = "hlsharness"
version = "0.1.0"
description = "Generic HLS agent evaluation harness — pluggable, multi-agent, Azure OpenAI powered"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.3.0",
    "agent-framework-openai>=1.3.0",
    "azure-identity>=1.25.3",
    "openai>=2.36.0",
    "pandas>=2.0",
    "pypdf>=4.0.0",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.57.0",
    "weasyprint>=61.0",
]

[project.scripts]
hls-eval = "hlsharness.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
spike = []  # agent-framework promoted to main deps in Slice 15B

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hlsharness --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "hlsharness/maf_agent.py",   # build_maf_agent requires Azure; tested via integration
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hlsharness.maf_agent"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hlsharness.stub_middleware"
ignore_errors = true

[tool.ruff]
line-length = 100
exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
